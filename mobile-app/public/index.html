<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Paciente — Clínica Estefana</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #38bdf8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-viewport { width: 100%; max-width: 480px; min-height: 100vh; background: white; display: flex; flex-direction: column; box-shadow: 0 0 25px rgba(0, 0, 0, 0.05); position: relative; }
    .app-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 24px 20px; border-radius: 0 0 24px 24px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-user { font-size: 14px; opacity: 0.9; }
    .header-title { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .logout-btn { background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .app-content { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 90px; }
    .highlight-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .highlight-card h4 { color: var(--primary-dark); font-size: 15px; margin-bottom: 6px; }
    .highlight-card p { font-size: 13px; color: #1e3a8a; line-height: 1.4; }
    .meal-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .meal-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .meal-time { font-size: 12px; background: #f1f5f9; padding: 4px 8px; border-radius: 12px; color: var(--text-muted); font-weight: 600; }
    .meal-items { font-size: 14px; color: #334155; line-height: 1.6; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; gap: 4px; }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 20px; }
    #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-container { background: white; width: 100%; max-width: 380px; padding: 32px 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .app-logo { font-size: 42px; margin-bottom: 8px; }
    .login-container h2 { font-size: 22px; color: var(--primary-dark); margin-bottom: 6px; }
    .login-container p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .form-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; margin-bottom: 14px; outline: none; transition: 0.2s; }
    .form-input:focus { border-color: var(--primary); }
    .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .submit-btn:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-container">
      <div class="app-logo">🥗</div>
      <h2>Área do Paciente</h2>
      <p>Clínica Estefana</p>
      <form id="patient-login-form">
        <input type="email" id="login-email" class="form-input" placeholder="Seu e-mail cadastrado" required>
        <input type="password" id="login-password" class="form-input" placeholder="Sua senha" required>
        <button type="submit" class="submit-btn">Entrar</button>
      </form>
    </div>
  </div>

  <div class="app-viewport">
    <header class="app-header">
      <div class="header-top">
        <span class="header-user" id="welcome-user">Olá, Paciente</span>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>
      <h1 class="header-title" id="screen-title">Meu Plano Alimentar</h1>
    </header>

    <main class="app-content">
      <section id="section-diet">
        <div class="highlight-card" id="diet-header-card" style="display: none;">
          <h4 id="diet-plan-title">Plano Alimentar</h4>
          <p id="diet-plan-desc">Orientações do seu nutricionista.</p>
        </div>
        <div id="meals-container">
          <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">Carregando seu plano...</div>
        </div>
      </section>

      <section id="section-appointments" style="display: none;">
        <div id="appointments-container">
          <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">Carregando agendamentos...</div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('section-diet', 'Meu Plano Alimentar', this)">
        <span class="nav-icon">🥗</span>
        <span>Plano</span>
      </button>
      <button class="nav-item" onclick="switchTab('section-appointments', 'Minhas Consultas', this)">
        <span class="nav-icon">📅</span>
        <span>Agenda</span>
      </button>
    </nav>
  </div>

  <script>
    const API_BASE = '/api';
    let token = localStorage.getItem('estefana_patient_token');

    if (!token) {
      document.getElementById('login-screen').style.display = 'flex';
    } else {
      document.getElementById('login-screen').style.display = 'none';
      initApp();
    }

    document.getElementById('patient-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch(`${API_BASE}/auth/patient-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('estefana_patient_token', data.token);
          localStorage.setItem('estefana_patient_info', JSON.stringify(data.patient));
          token = data.token;
          document.getElementById('login-screen').style.display = 'none';
          initApp();
        } else {
          alert('Erro no acesso: ' + (data.error || 'Credenciais inválidas'));
        }
      } catch (err) {
        alert('Erro ao conectar com o servidor: ' + err.message);
      }
    });

    function logout() {
      localStorage.removeItem('estefana_patient_token');
      localStorage.removeItem('estefana_patient_info');
      window.location.reload();
    }

    function switchTab(sectionId, title, btn) {
      document.querySelectorAll('.app-content > section').forEach(sec => sec.style.display = 'none');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(sectionId).style.display = 'block';
      document.getElementById('screen-title').textContent = title;
      btn.classList.add('active');
    }

    function initApp() {
      const patientInfo = JSON.parse(localStorage.getItem('estefana_patient_info') || '{}');
      if (patientInfo.name) {
        document.getElementById('welcome-user').textContent = `Olá, ${patientInfo.name.split(' ')[0]}`;
      }
      loadDiet();
      loadAppointments();
    }

    async function loadDiet() {
      const container = document.getElementById('meals-container');
      try {
        const res = await fetch(`${API_BASE}/diets/my-plan`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const diet = await res.json();

        if (diet && diet.title) {
          document.getElementById('diet-header-card').style.display = 'block';
          document.getElementById('diet-plan-title').textContent = diet.title;
          document.getElementById('diet-plan-desc').textContent = diet.description || 'Siga as orientações nutricionais.';

          const meals = diet.meals && Array.isArray(diet.meals) ? diet.meals : [
            { time: '07:30', name: 'Café da Manhã', items: 'Ovos mexidos, fruta fresca e café sem açúcar.' },
            { time: '12:30', name: 'Almoço', items: 'Prato colorido com vegetais, carboidrato integral e proteína magra.' },
            { time: '16:00', name: 'Lanche da Tarde', items: 'Iogurte natural com sementes de chia ou castanhas.' },
            { time: '19:30', name: 'Jantar', items: 'Salada de folhas escuras com frango desfiado ou peixe grelhado.' }
          ];

          container.innerHTML = meals.map(m => `
            <div class="meal-card">
              <div class="meal-header">
                <span class="meal-title">${m.name}</span>
                <span class="meal-time">${m.time || 'Horário Livre'}</span>
              </div>
              <div class="meal-items">${m.items || m.description || ''}</div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px 10px; color: var(--text-muted);">
              <p style="font-size: 15px; margin-bottom: 6px;">Nenhum plano ativo no momento.</p>
              <p style="font-size: 13px;">Seu nutricionista disponibilizará sua dieta em breve.</p>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: red;">Erro ao carregar o plano nutricional.</div>';
      }
    }

    async function loadAppointments() {
      const container = document.getElementById('appointments-container');
      try {
        const res = await fetch(`${API_BASE}/appointments`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const list = await res.json();

        if (list && list.length > 0) {
          container.innerHTML = list.map(a => `
            <div class="meal-card">
              <div class="meal-header">
                <span class="meal-title">Consulta</span>
                <span class="meal-time">${a.status}</span>
              </div>
              <p style="font-size: 14px; font-weight: 600; color: var(--primary);">
                📅 ${new Date(a.scheduled_at).toLocaleString('pt-BR')}
              </p>
              <p style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">
                Profissional: ${a.doctor_name || 'Dr(a). Nutricionista'}
              </p>
              ${a.notes ? `<p style="font-size: 12px; margin-top: 4px; color: #475569;">Obs: ${a.notes}</p>` : ''}
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px 10px; color: var(--text-muted);">
              <p>Nenhuma consulta marcada no momento.</p>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: red;">Erro ao carregar agendamentos.</div>';
      }
    }
  </script>
</body>
</html>
